[package]
name = "ipswitcher"
version = "2.2.4"
description = "网卡 IP 快速切换工具"
authors = ["JamHoo"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipswitcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "IPSwitcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
